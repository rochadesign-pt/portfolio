<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocha Design Studio — Branding, Web & Product Design</title>
    <meta
      name="description"
      content="Rocha Design Studio — estúdio de design de branding, web e produto. Criamos marcas e produtos digitais com craft e intenção."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Space+Grotesk:wght@300..700&family=Funnel+Sans:wght@300..700&family=Hanken+Grotesk:wght@300..700&family=Onest:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- Fontshare (loads in the visitor's browser) — General Sans + Switzer for the type playground -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&f[]=switzer@300,400,500,600,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('rds-theme') || 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
