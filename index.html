<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Rocha Design Studio — Branding, Web & Product Design</title>
    <meta
      name="description"
      content="Rocha Design Studio — estúdio de design de branding, web e produto. Criamos marcas e produtos digitais com craft e intenção."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="author" content="Rocha Design Studio" />
    <link rel="canonical" href="https://rochadesign.pt/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rocha Design Studio" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://rochadesign.pt/" />
    <meta property="og:title" content="Rocha Design Studio — Branding, Web & Product Design" />
    <meta
      property="og:description"
      content="Estúdio de design em Portugal. Branding, web e produto digital com craft e intenção, para marcas que se querem destacar."
    />
    <meta property="og:image" content="https://rochadesign.pt/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rocha Design Studio — Branding, Web & Product Design" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rocha Design Studio — Branding, Web & Product Design" />
    <meta
      name="twitter:description"
      content="Estúdio de design em Portugal. Branding, web e produto digital com craft e intenção."
    />
    <meta name="twitter:image" content="https://rochadesign.pt/og-image.png" />

    <!-- Structured data: the studio + the site -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://rochadesign.pt/#organization",
            "name": "Rocha Design Studio",
            "url": "https://rochadesign.pt/",
            "email": "hello@rochadesign.pt",
            "logo": "https://rochadesign.pt/og-image.png",
            "image": "https://rochadesign.pt/og-image.png",
            "description": "Estúdio de design de branding, web e produto digital. Criamos marcas e produtos digitais com craft e intenção.",
            "foundingDate": "2025",
            "founder": { "@type": "Person", "name": "Tiago Rocha" },
            "address": { "@type": "PostalAddress", "addressCountry": "PT" },
            "areaServed": "Worldwide",
            "knowsAbout": [
              "Branding",
              "Brand Identity",
              "Web Design",
              "UI/UX Design",
              "Product Design",
              "Design Systems"
            ],
            "sameAs": [
              "https://instagram.com",
              "https://www.behance.net",
              "https://www.linkedin.com",
              "https://dribbble.com"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://rochadesign.pt/#website",
            "url": "https://rochadesign.pt/",
            "name": "Rocha Design Studio",
            "inLanguage": "pt-PT",
            "publisher": { "@id": "https://rochadesign.pt/#organization" }
          },
          {
            "@type": "ProfessionalService",
            "@id": "https://rochadesign.pt/#service",
            "name": "Rocha Design Studio",
            "url": "https://rochadesign.pt/services",
            "parentOrganization": { "@id": "https://rochadesign.pt/#organization" },
            "serviceType": ["Branding & Identity", "Web & Digital Design", "UI/UX & Product Design"],
            "areaServed": "Worldwide",
            "provider": { "@id": "https://rochadesign.pt/#organization" }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <!-- Switzer (Fontshare) for display + body; Season Mix (self-hosted) for the
         accent words. Loaded without blocking first paint; font-display: swap
         paints text immediately in the fallback. -->
    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600,700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <link rel="preload" as="font" type="font/ttf" href="/fonts/SeasonMix-Regular.ttf" crossorigin />
    <noscript>
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600,700&display=swap" />
    </noscript>
  </head>
  <body>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('rds-theme') || 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
