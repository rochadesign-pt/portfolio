  <rect x="138" y="206" width="70" height="20" rx="6" fill="#1c1c1f"/>
  <rect x="1180" y="200" width="120" height="32" rx="16" fill="#f2efe9"/>
  <rect x="1320" y="200" width="90" height="32" rx="16" fill="#f2efe9"/>
  <rect x="1420" y="200" width="90" height="32" rx="16" fill="#f2efe9"/>
  <line x1="70" y1="252" x2="1530" y2="252" stroke="#eceae6"/>
  <!-- tabs -->
  <rect x="110" y="292" width="120" height="20" rx="6" fill="#1c1c1f"/>
  <rect x="260" y="292" width="90" height="20" rx="6" fill="#c9c6c0"/>
