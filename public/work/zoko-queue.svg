    <circle cx="140" cy="890" r="22" fill="#cfe3ff"/>
    <rect x="180" y="874" width="150" height="16" rx="5" fill="#1c1c1f"/>
    <rect x="180" y="898" width="150" height="12" rx="4" fill="#c9c6c0"/>
    <rect x="620" y="882" width="160" height="14" rx="5" fill="#8a8780"/>
