    <rect x="112" y="628" width="18" height="18" rx="5" fill="#EE5A2A"/>
    <circle cx="164" cy="637" r="22" fill="#e7ddff"/>
    <rect x="204" y="620" width="170" height="16" rx="5" fill="#1c1c1f"/>
    <rect x="204" y="644" width="150" height="12" rx="4" fill="#c9c6c0"/>
    <rect x="620" y="629" width="120" height="14" rx="5" fill="#8a8780"/>
    <rect x="1360" y="629" width="150" height="12" rx="4" fill="#c9c6c0"/>
    <!-- row 4 -->
    <circle cx="140" cy="722" r="22" fill="#e7ddff"/>
    <rect x="180" y="706" width="150" height="16" rx="5" fill="#1c1c1f"/>
    <rect x="180" y="730" width="150" height="12" rx="4" fill="#c9c6c0"/>
    <rect x="620" y="714" width="240" height="14" rx="5" fill="#8a8780"/>
