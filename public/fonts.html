<!doctype html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Serif accent — playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Fraunces:ital,opsz,wght@1,9..144,100..900&family=Playfair+Display:ital,wght@1,400..900&family=Cormorant:ital,wght@1,300..700&family=Newsreader:ital,opsz,wght@1,6..72,200..800&family=DM+Serif+Display:ital@1&family=Bodoni+Moda:ital,opsz,wght@1,6..96,400..900&display=swap" />
<style>
  :root { --bg:#0b0b0d; --text:#f2efe9; --muted:#8f8b83; --line:#26262a; --surface:#151517; --acc:#ffc700;
          --acc-font:'Instrument Serif',serif; --acc-weight:400; --acc-track:-0.035em; --acc-kern:normal;
          --acc-style:italic; --size:52px; }
  :root[data-theme="light"] { --bg:#f2efe9; --text:#17140f; --muted:#6f6b63; --line:#dcd8cf; --surface:#fff; --acc:#17140f; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Switzer',system-ui,sans-serif;
         -webkit-font-smoothing:antialiased; transition:background .3s,color .3s; }

  /* Controls */
  .panel { position:sticky; top:0; z-index:5; background:color-mix(in srgb,var(--bg) 88%, transparent);
           backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:16px clamp(20px,4vw,48px); }
  .panel .grid { display:flex; flex-wrap:wrap; gap:18px 28px; align-items:flex-end; }
  .fld { display:flex; flex-direction:column; gap:7px; }
  .fld label { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .fld .val { color:var(--acc); font-variant-numeric:tabular-nums; }
  select, input[type=range] { font-family:inherit; accent-color:var(--acc); }
  select { background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px; }
  input[type=range] { width:170px; }
  .chk { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); }
  button { font-family:inherit; font-size:13px; color:var(--text); background:var(--surface);
           border:1px solid var(--line); border-radius:999px; padding:9px 16px; cursor:pointer; }

  /* Stage */
  main { padding:clamp(36px,7vw,96px) clamp(20px,4vw,48px); }
  .eyebrow { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:22px; }
  .line { font-weight:300; font-size:var(--size); line-height:1.08; letter-spacing:-0.045em; max-width:20ch; }
  .acc { font-family:var(--acc-font); font-style:var(--acc-style); font-weight:var(--acc-weight);
         letter-spacing:var(--acc-track); font-kerning:var(--acc-kern); color:var(--acc); }
  .divider { height:1px; background:var(--line); margin:clamp(40px,6vw,72px) 0; }
  .solo { font-family:var(--acc-font); font-style:var(--acc-style); font-weight:var(--acc-weight);
          letter-spacing:var(--acc-track); font-kerning:var(--acc-kern); color:var(--acc);
          font-size:clamp(56px,12vw,150px); line-height:1; }
  .hint { margin-top:14px; font-size:13px; color:var(--muted); max-width:60ch; }
</style>
</head>
<body>
  <div class="panel">
    <div class="grid">
      <div class="fld">
        <label>Fonte</label>
        <select id="font">
          <option value="'Instrument Serif',serif">Instrument Serif (atual)</option>
          <option value="'Fraunces',serif">Fraunces</option>
          <option value="'Playfair Display',serif">Playfair Display</option>
          <option value="'Cormorant',serif">Cormorant</option>
          <option value="'Newsreader',serif">Newsreader</option>
          <option value="'DM Serif Display',serif">DM Serif Display</option>
          <option value="'Bodoni Moda',serif">Bodoni Moda</option>
        </select>
      </div>
      <div class="fld">
        <label>Peso · <span class="val" id="wv">400</span></label>
        <input type="range" id="weight" min="100" max="900" step="10" value="400" />
      </div>
      <div class="fld">
        <label>Tracking · <span class="val" id="tv">-0.035em</span></label>
        <input type="range" id="track" min="-0.08" max="0.03" step="0.002" value="-0.035" />
      </div>
      <div class="fld">
        <label>Tamanho · <span class="val" id="sv">52px</span></label>
        <input type="range" id="size" min="32" max="120" step="1" value="52" />
      </div>
      <div class="fld">
        <label>Kerning</label>
        <span class="chk"><input type="checkbox" id="kern" checked /> font-kerning</span>
      </div>
      <div class="fld">
        <label>Itálico</label>
        <span class="chk"><input type="checkbox" id="ital" checked /> italic</span>
      </div>
      <button id="theme">☀︎ / ☾ tema</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  <main>
    <div class="eyebrow">Pré-visualização · contexto Home</div>
    <div class="line">Desenhamos marcas e produtos digitais com <span class="acc">craft e intenção.</span></div>
    <div class="divider"></div>
    <div class="eyebrow">Accent isolado</div>
    <div class="solo">craft &amp; intenção</div>
    <div class="hint">Nota: nem todas as fontes têm pesos variáveis — Instrument Serif e DM Serif Display só têm 400, por isso o slider de peso não as afeta.</div>
  </main>

  <script>
    var root = document.documentElement, S = root.style
    function bind(id, fn) { document.getElementById(id).addEventListener('input', fn) }
    bind('font', function (e) { S.setProperty('--acc-font', e.target.value) })
    bind('weight', function (e) { S.setProperty('--acc-weight', e.target.value); document.getElementById('wv').textContent = e.target.value })
    bind('track', function (e) { var v = (+e.target.value).toFixed(3) + 'em'; S.setProperty('--acc-track', v); document.getElementById('tv').textContent = v })
    bind('size', function (e) { S.setProperty('--size', e.target.value + 'px'); document.getElementById('sv').textContent = e.target.value + 'px' })
    bind('kern', function (e) { S.setProperty('--acc-kern', e.target.checked ? 'normal' : 'none') })
    bind('ital', function (e) { S.setProperty('--acc-style', e.target.checked ? 'italic' : 'normal') })
    document.getElementById('theme').addEventListener('click', function () { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark' })
    document.getElementById('reset').addEventListener('click', function () {
      root.dataset.theme = 'dark'
      var d = { font: "'Instrument Serif',serif", weight: 400, track: -0.035, size: 52, kern: true, ital: true }
      document.getElementById('font').value = d.font
      document.getElementById('weight').value = d.weight; document.getElementById('wv').textContent = d.weight
      document.getElementById('track').value = d.track; document.getElementById('tv').textContent = d.track.toFixed(3) + 'em'
      document.getElementById('size').value = d.size; document.getElementById('sv').textContent = d.size + 'px'
      document.getElementById('kern').checked = true; document.getElementById('ital').checked = true
      S.setProperty('--acc-font', d.font); S.setProperty('--acc-weight', d.weight)
      S.setProperty('--acc-track', d.track + 'em'); S.setProperty('--size', d.size + 'px')
      S.setProperty('--acc-kern', 'normal'); S.setProperty('--acc-style', 'italic')
    })
  </script>
</body>
</html>
